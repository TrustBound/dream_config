name = "dream_config"
version = "2.0.0"
description = "Type-safe configuration management for Gleam applications"
licences = ["MIT"]
repository = { type = "github", user = "TrustBound", repo = "dream_config" }
links = [
    { title = "Documentation", href = "https://hexdocs.pm/dream_config" },
    { title = "GitHub", href = "https://github.com/TrustBound/dream_config" },
]

[documentation]
pages = [
    { title = "Getting started", path = "guides/getting-started.html", source = "./docs/guides/getting-started.md" },
    { title = "Use a .env file in development", path = "guides/env-files.html", source = "./docs/guides/env-files.md" },
    { title = "Read optional settings, numbers and flags", path = "guides/typed-values.html", source = "./docs/guides/typed-values.md" },
]

[dependencies]
gleam_stdlib = ">= 1.0.0 and < 2.0.0"
envoy = ">= 1.0.0 and < 2.0.0"

[dev-dependencies]
dream_test = ">= 3.0.0 and < 4.0.0"
dream_snippets = ">= 1.0.0 and < 2.0.0"

[tools.dream_snippets]
# Changelog sections and release notes before this version are history. They are not checked.
checked_from_version = "2.0.0"
# The files that the tests and CI use. Docs blocks that are not Gleam copy them.
tested_files = ["test", ".github", "scripts"]
