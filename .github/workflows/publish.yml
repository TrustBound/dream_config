name: Publish to Hex

on:
  push:
    branches:
      - main
    paths:
      - "gleam.toml"
      - "src/**/*.gleam"
      - "src/**/*.erl"
      - ".github/workflows/publish.yml"
  workflow_dispatch:
    # Allows manual triggering

jobs:
  publish:
    name: Publish Package to Hex
    runs-on: ubuntu-latest
    permissions:
      contents: write # Allow creating git tags

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check that every dependency comes from Hex
        # Hex rejects a package with a path or git dependency. Path and git
        # dependencies are only for work before the dependency is published.
        run: |
          if grep -nE '(path|git)[[:space:]]*=' gleam.toml; then
            echo "Error: gleam.toml has a path or git dependency (lines above)."
            echo "Fix: change each one to a Hex version range, for example"
            echo '  dream_test = ">= 3.0.0 and < 4.0.0"'
            echo "then push again."
            exit 1
          fi
          echo "✓ Every dependency comes from Hex"

      - name: Check if version exists on Hex
        id: version_check
        env:
          FORCE_PUBLISH: ${{ secrets.FORCE_PUBLISH }}
        run: |
          # Check if force publish is enabled
          if [ "$FORCE_PUBLISH" = "true" ]; then
            echo "FORCE_PUBLISH is enabled, bypassing version check"
            CURRENT_VERSION=$(grep '^version = ' gleam.toml | sed 's/version = "\(.*\)"/\1/')
            echo "version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
            echo "should_publish=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Get current version
          CURRENT_VERSION=$(grep '^version = ' gleam.toml | sed 's/version = "\(.*\)"/\1/')
          echo "Current version: $CURRENT_VERSION"
          echo "version=$CURRENT_VERSION" >> $GITHUB_OUTPUT

          # Check once if this version already exists on Hex. No retry: Hex
          # rate-limits, so a failed lookup stops the publish.
          if ! HTTP_RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 10 \
            "https://hex.pm/api/packages/dream_config/releases/$CURRENT_VERSION"); then
            echo "Error: Failed to check Hex API (curl failed)"
            exit 1
          fi

          # Handle HTTP status codes
          case "$HTTP_RESPONSE" in
            200)
              echo "✓ Version $CURRENT_VERSION already exists on Hex, skipping publish"
              echo "should_publish=false" >> $GITHUB_OUTPUT
              ;;
            404)
              echo "✓ Version $CURRENT_VERSION not found on Hex, will publish"
              echo "should_publish=true" >> $GITHUB_OUTPUT
              ;;
            429)
              echo "Error: Hex API rate limit exceeded (HTTP 429)"
              exit 1
              ;;
            5*)
              echo "Error: Hex API server error (HTTP $HTTP_RESPONSE)"
              exit 1
              ;;
            *)
              echo "Error: Unexpected HTTP status from Hex API: $HTTP_RESPONSE"
              exit 1
              ;;
          esac

      - name: Install Erlang and Gleam
        if: steps.version_check.outputs.should_publish == 'true'
        uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          gleam-version: "1.19.2"
          rebar3-version: "3"

      - name: Download dependencies
        if: steps.version_check.outputs.should_publish == 'true'
        run: gleam deps download

      - name: Build project
        if: steps.version_check.outputs.should_publish == 'true'
        run: gleam build

      - name: Run tests
        if: steps.version_check.outputs.should_publish == 'true'
        run: gleam test

      - name: Check docs code blocks against tested snippets
        if: steps.version_check.outputs.should_publish == 'true'
        run: gleam run -m dream_snippets

      - name: Publish to Hex
        id: publish_hex
        if: steps.version_check.outputs.should_publish == 'true'
        env:
          HEXPM_API_KEY: ${{ secrets.HEX_API_KEY }}
        run: |
          if [ -z "$HEXPM_API_KEY" ]; then
            echo "Error: HEX_API_KEY secret is not set"
            exit 1
          fi
          gleam publish --yes

      - name: Create and push git tag
        if: steps.version_check.outputs.should_publish == 'true' && steps.publish_hex.outcome == 'success'
        run: |
          VERSION="${{ steps.version_check.outputs.version }}"
          TAG="${VERSION}"

          # Check if tag already exists
          if git rev-parse "${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists, skipping tag creation"
            exit 0
          fi

          # Configure git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Create and push tag
          echo "Creating git tag: ${TAG}"
          git tag -a "${TAG}" -m "Release dream_config ${VERSION}"
          git push origin "${TAG}"
          echo "✓ Successfully created and pushed tag: ${TAG}"

      - name: Summary
        if: steps.version_check.outputs.should_publish == 'true'
        run: |
          VERSION="${{ steps.version_check.outputs.version }}"
          echo "## 📦 Package Published Successfully!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${VERSION}" >> $GITHUB_STEP_SUMMARY
          echo "**Package:** dream_config" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Hex:** https://hex.pm/packages/dream_config/${VERSION}" >> $GITHUB_STEP_SUMMARY
          echo "**Docs:** https://hexdocs.pm/dream_config/${VERSION}" >> $GITHUB_STEP_SUMMARY
